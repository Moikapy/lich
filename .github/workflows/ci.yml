name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Build
        run: node node_modules/tsup/dist/cli-default.js src/index.ts src/cli.ts --format esm --dts --clean --sourcemap
      - name: Test
        env:
          CLAUDECODE: ""
          CLAUDE_CODE: ""
        run: env -u CLAUDECODE -u CLAUDE_CODE node node_modules/vitest/vitest.mjs run

  ossuary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ossuary
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --ignore-scripts skips the postinstall Electron binary download; the build doesn't need it.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        # Smoke spawn needs monorepo root deps; keep unit tests in this job.
        run: bun x vitest run --exclude '**/*.smoke.test.ts'
      - name: Build
        run: bun run build
